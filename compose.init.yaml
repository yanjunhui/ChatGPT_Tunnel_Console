# Created by Yanjunhui
name: go-tunnel-ssh
services:
  init:
    image: ${TUNNEL_SSH_MCP_IMAGE:-go-tunnel-ssh-mcp:latest}
    build:
      context: .
      target: runtime
      args:
        TUNNEL_CLIENT_VERSION: v0.0.19
    user: "0:0"
    # One-shot root setup assigns persisted files to the non-root runtime account.
    # 一次性 root 初始化将持久化文件归属设为非 root 运行账户。
    entrypoint: ["/usr/bin/tini", "--", "tunnel-console-mcp", "init", "--container", "--output", "/etc/tunnel-ssh", "--owner-uid", "1000", "--owner-gid", "1000"]
    command: []
    stdin_open: true
    tty: true
    volumes:
      - ${TUNNEL_SSH_CONFIG_DIR:-./data}:/etc/tunnel-ssh
      - ${TUNNEL_SSH_INIT_INPUT_DIR:-./init-input}:/input:ro
