# Created by Yanjunhui
# Copy to init-input/config.toml and import through compose.init.yaml.
# 复制到 init-input/config.toml，再通过 compose.init.yaml 导入。
default_profile = "local-dev"
output_bytes = 1048576

[tunnel]
id = "tunnel_replace_with_your_tunnel_id"
# init copies this credential into a private generation; runtime no longer needs /input.
# init 将凭据复制到私有配置代次，运行时不再依赖 /input 导入文件。
api_key = "file:/input/openai-tunnel-key"
health_addr = "127.0.0.1:8080"

[profiles.local-dev]
host = "dev"
port = 22
user = "developer"
private_key = "/var/lib/tunnel-ssh/client_key"
# This built-in identity is generated by dev on first startup, after init completes.
# 此内置身份由开发容器首次启动时生成，因此初始化时可以尚不存在。
workdir = "/workspace"
connect_timeout = "15s"
command_timeout = "60s"

# Optional native X11 desktop; independent of VNC. / 可选原生 X11 桌面，独立于 VNC。
# [profiles.local-dev.desktop]
# enabled = true
# display = ":1"
# timeout = "15s"

# Optional desktop, reached from the SSH target. Disabled unless explicitly enabled.
# 可选桌面从 SSH 目标访问，只有显式启用后才生效。
# [profiles.local-dev.vnc]
# enabled = true
# host = "127.0.0.1"
# port = 5901
# timeout = "15s"
# Password reference is only needed for VncAuth; omit for the bundled loopback desktop.
# 只有 VncAuth 需要密码引用，自带回环桌面应省略。
# password = "file:/input/vnc-password"
